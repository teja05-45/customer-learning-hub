name: customer-learning-hub

services:
  backend:
    build:
      context: ./backend
    image: customer-learning-hub-api:1.0.0
    container_name: clh-api
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      DATABASE_URL: sqlite:////app/data/clh.db
      SEED_ON_STARTUP: "true"
      SEED_DEMO_DATA: "true"
      DEMO_MODE: "true"
      CORS_ORIGINS: http://localhost:8081,http://127.0.0.1:8081
    volumes:
      - clh-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: customer-learning-hub-web:1.0.0
    container_name: clh-web
    depends_on:
      backend:
        condition: service_healthy
    # Host port 8081 because 8080 is often already taken locally. The container
    # always listens on 8080, so this is the only place to change it.
    ports:
      - "8081:8080"
    restart: unless-stopped

volumes:
  clh-data:
